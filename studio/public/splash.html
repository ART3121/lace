<!doctype html>
<!--
  O splash da AURORA IDE: a janela pequena, sem moldura, que aparece logo ao
  abrir (janela `splash` do tauri.conf.json) enquanto a principal carrega
  escondida por trás. O camaleão aparece numa volta, como um ponteiro que
  varre o desenho a partir do focinho (splash.js). As cores padrão são as do
  tema Azul; o splash.js troca pelas do último tema usado.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURORA IDE</title>
    <style>
      :root {
        --bg: #101214;
        --fg: #eaedf1;
        --muted: #909296;
        --mark: #59a0f9;
        --pulse: #73aef8;
        --track: #232528;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        cursor: default;
        user-select: none;
      }

      .splash {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        box-sizing: border-box;
        padding-bottom: 18px;
      }

      .mark {
        width: 92px;
        height: 92px;
      }

      .mark path {
        fill: var(--mark);
      }

      /* O nome aparece quando a volta do camaleão termina. */
      .name {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-top: 22px;
        opacity: 0;
        animation: rise 600ms ease-out 850ms forwards;
      }

      .wordmark {
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .product {
        color: var(--muted);
        font-size: 25px;
        font-weight: 300;
        letter-spacing: 0.02em;
      }

      .status {
        min-height: 16px;
        margin-top: 20px;
        color: var(--muted);
        font-size: 12px;
        opacity: 0;
        animation: rise 500ms ease-out 1150ms forwards;
      }

      /* A barra sem fim: um trecho que corre enquanto a IDE abre. */
      .bar {
        position: relative;
        width: 168px;
        height: 2px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 1px;
        background: var(--track);
        opacity: 0;
        animation: rise 500ms ease-out 1150ms forwards;
      }

      .bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 40%;
        border-radius: inherit;
        background: var(--pulse);
        animation: run 1.3s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .version {
        position: absolute;
        right: 14px;
        bottom: 10px;
        color: var(--muted);
        font-size: 11px;
        opacity: 0.8;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes run {
        to {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .name,
        .status,
        .bar {
          opacity: 1;
          animation: none;
        }

        .bar::after {
          animation: none;
          left: 30%;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <svg class="mark" viewBox="1769.4 1520 4420 4420" aria-hidden="true">
        <defs>
          <!-- A máscara é um traço grosso em volta do centro da espiral: com
               o tracejado, ele vira uma fatia que cresce de 0 a 360 graus e
               mostra o desenho na ordem em que a espiral corre. Sem o
               splash.js, o traço inteiro mostra o camaleão todo. -->
          <mask id="sweep" maskUnits="userSpaceOnUse" x="1769.4" y="1520" width="4420" height="4420">
            <circle id="sweep-arc" cx="4249" cy="4004" r="1300" fill="none" stroke="#fff" stroke-width="2600" transform="rotate(180 4249 4004)" />
          </mask>
        </defs>
        <!-- O contorno do camaleão: o mesmo do AuroraMark (src/components/common.tsx). -->
        <path mask="url(#sweep)" d="M3930 1801l0 282l57 -7c768 -88 1469 233 1886 864c544 825 369 1947 -402 2566c-359 289 -769 434 -1223 434c-312 0 -590 -66 -873 -208c-161 -80 -371 -226 -452 -314l-22 -24l173 -173l174 -174l74 60c240 197 496 303 806 333c145 15 316 0 479 -40c563 -138 914 -496 1050 -1070c30 -130 42 -390 24 -521c-80 -553 -453 -1004 -978 -1178c-165 -55 -239 -66 -458 -66c-213 0 -264 7 -440 62c-83 26 -249 102 -323 148l-42 26l0 -315c0 -208 -3 -316 -10 -316c-21 0 -187 89 -275 147c-301 199 -532 454 -691 765l-55 108l48 0c26 0 430 -5 897 -10c888 -11 940 -10 1078 31c437 128 726 557 678 1009c-12 118 -38 210 -90 318c-50 104 -86 157 -169 244c-201 214 -502 324 -793 290c-179 -21 -380 -106 -495 -208l-48 -43l174 -174l174 -175l49 34c94 64 240 90 357 63c195 -45 350 -238 351 -436c0 -203 -128 -381 -319 -443l-70 -22l-1231 8l-1230 9l0 -31c0 -63 53 -294 101 -439c144 -433 412 -832 753 -1119c276 -233 589 -402 928 -501c118 -34 309 -75 354 -75l24 0l0 281z" />
      </svg>
      <div class="name" aria-label="AURORA IDE">
        <span class="wordmark" aria-hidden="true">AURORA</span>
        <span class="product" aria-hidden="true">IDE</span>
      </div>
      <div class="status" id="status" role="status"></div>
      <div class="bar" aria-hidden="true"></div>
      <div class="version" id="version"></div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
