[workspace]
resolver = "3"
members = ["crates/lace-core", "crates/lace-learn", "crates/lace-cli", "crates/lace-installer"]
# O Lace Studio (studio/) tem o próprio workspace e o próprio Cargo.lock:
# o Tauri pede as bibliotecas de sistema do WebView e a interface já
# compilada, que os testes do Core e da CLI não precisam.
exclude = ["studio/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
lace-core = { path = "crates/lace-core" }
lace-learn = { path = "crates/lace-learn" }
lace-installer = { path = "crates/lace-installer" }
camino = { version = "1", features = ["serde1"] }
dunce = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
anstream = "1"
anstyle = "1"
clap_complete = "4"
insta = { version = "1", features = ["json", "redactions"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
zstd = { version = "0.14", features = ["zstdmt"] }
tar = "0.4"
flate2 = "1"
schemars = "1"
jsonschema = { version = "0.58", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "process", "system"] }
signal-hook = { version = "0.3", default-features = false }
win32job = "2"
fst-reader = "0.17"
roxmltree = "0.21"
