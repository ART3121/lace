[package]
name = "solar-installer"
description = "Instalador do Solar para Linux e macOS, e o empacotador dos instaladores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "solar-installer"
path = "src/main.rs"

[[bin]]
name = "solar-pack"
path = "src/bin/solar-pack.rs"

[dependencies]
solar-core.workspace = true
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
zstd.workspace = true
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
