[package]
name = "lace-cli"
description = "Linha de comando do Lace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lace"
path = "src/main.rs"

[dependencies]
lace-core.workspace = true
lace-installer.workspace = true
lace-learn.workspace = true
# O assistente do lace chat: uma sessão do Claude Code com o lace mcp.
lace-agent.workspace = true
anyhow.workspace = true
anstream.workspace = true
anstyle.workspace = true
clap_complete.workspace = true
camino.workspace = true
clap.workspace = true
dunce.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
tar.workspace = true
flate2.workspace = true
# A tela do modo watch do `lace learn` (learn_tui.rs), como a TUI do
# instalador; `line_count` limita a rolagem do enunciado.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `lace proc remove --delete` manda a pasta do processador para a lixeira do
# sistema, como o Studio: nada de código do usuário se perde de vez.
trash.workspace = true

[dev-dependencies]
jsonschema.workspace = true
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
