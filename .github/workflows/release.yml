# Release do Solar: numa tag vX.Y.Z, monta e testa os instaladores das três
# plataformas (installers.yml) e cria um RASCUNHO de release no GitHub com
# eles, o SHA256SUMS e as notas da versão no CHANGELOG.md. Publicar o
# rascunho é manual.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]

jobs:
  # Antes de gastar uma hora de build: a tag tem que ser a versão do
  # Cargo.toml, e o CHANGELOG.md tem que ter a seção dela.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag, versão e CHANGELOG
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='solar-cli'][0])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "a tag é $GITHUB_REF_NAME, mas o Cargo.toml diz $version"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "o CHANGELOG.md não tem a seção ## $version"; exit 1; }

  installers:
    needs: check
    uses: ./.github/workflows/installers.yml

  publish:
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Somas e notas
        run: |
          version="${{ needs.installers.outputs.version }}"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          {
            awk -v v="$version" '/^## / { p = ($2 == v) } p' CHANGELOG.md
            printf '\n## Arquivos\n\n```\n'
            cat dist/SHA256SUMS
            printf '```\n'
          } > notes.md
          cat notes.md
      - name: Rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Solar ${{ needs.installers.outputs.version }}" \
            --notes-file notes.md dist/*
