# Instaladores do Lace nas três plataformas, sem testes: os instaladores
# publicados se testam à mão.
#
# Chamado pelo release.yml (numa tag). Em cada plataforma:
#
# 1. monta o bundle com scripts/bundle.py (OSS CAD Suite fixado e dividido
#    por ferramenta, YANC compilado do commit fixado, surfer-aurora
#    pré-compilado (ou compilado, sem o pré-compilado), o Lace Studio
#    compilado de studio/);
# 2. monta o instalador: a TUI (install + payload/, em .tar.gz) no Linux e no
#    macOS; no Windows, os dois assistentes do Inno Setup, o completo e o
#    web, que baixa da release só os aplicativos escolhidos;
# 3. publica o instalador e os pedaços do bundle como artefato do workflow.

name: installers

on:
  workflow_call:
    outputs:
      version:
        description: Versão do Lace (a do Cargo.toml)
        value: ${{ jobs.build.outputs.version }}

env:
  CARGO_TERM_COLOR: always
  INNO_VERSION: "6.7.3"
  # O menor macOS que os binários compilados aqui aceitam: o do OSS CAD Suite.
  # Vale para o YANC, o Lace, o surfer-aurora e o Studio.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    name: instalador (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # A distribuição mais antiga que o Lace atende: o que sai daqui
          # exige a glibc dela (2.35), e ela tem o webkit2gtk 4.1 do Studio.
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # O Studio: a interface (Vite) e o tauri build, que o bundle.py chama.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Versão
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='lace-cli'][0])")
          bundle=$(python -c "import json; print(json.load(open('bundle/versions.json'))['bundle'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$version"
            echo "BUNDLE=$bundle"
            echo "NAME=lace-$version-${{ matrix.platform }}"
          } >> "$GITHUB_ENV"

      - name: Cache do empacotamento
        uses: actions/cache@v4
        with:
          path: .bundle-cache/downloads
          key: downloads-${{ matrix.platform }}-${{ hashFiles('bundle/versions.json') }}

      # ------------------------------------------------ o que montar exige
      # flex e bison para o YANC; o resto, para compilar o Studio (Tauri).
      - name: Dependências de montagem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev

      - name: Dependências de montagem (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install flex bison
          echo "YANC_MAKE_ARGS=BISON=$(brew --prefix bison)/bin/bison FLEX=$(brew --prefix flex)/bin/flex" >> "$GITHUB_ENV"

      # No Windows: o MSYS2 do runner (C:\msys64), só para compilar o YANC. O
      # Icarus e o Verilator, com o g++, o make e o Perl que ele usa, vêm
      # prontos da release do lace-toolchain (o pacote msys de
      # bundle/versions.json).
      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          path-type: inherit
          install: >-
            make flex bison git
            mingw-w64-x86_64-gcc

      # ------------------------------------------------------------ bundle
      - name: Montar o bundle
        if: runner.os != 'Windows'
        run: python3 scripts/bundle.py --out dist/toolchain

      - name: Montar o bundle (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/bundle.py --out dist/toolchain

      - name: Compilar o Lace e o empacotador
        run: cargo build --release -p lace-cli -p lace-installer

      - name: Conferir o bundle
        run: target/release/lace tools --toolchain dist/toolchain --verify

      # ----------------------------------------------- Linux e macOS: TUI
      - name: Montar o instalador (TUI)
        if: runner.os != 'Windows'
        run: |
          target/release/lace-pack tui --toolchain dist/toolchain \
            --lace target/release/lace --installer target/release/lace-installer \
            --out "dist/$NAME" --tar-gz --assets dist/apps
          ls -la dist dist/apps

      # ------------------------------------------------ Windows: Inno Setup
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=$env:INNO_VERSION -y --no-progress }
          & $iscc /? | Select-Object -First 1
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # O `lace install`, o `lace update` e o assistente web baixam os
      # aplicativos do bundle em pedaços, também no Windows: o mesmo payload
      # da TUI, publicado à parte. Vem antes do Inno Setup, que grava no
      # web.iss o SHA-256 de cada pedaço.
      - name: Aplicativos do bundle em pedaços (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          target\release\lace-pack.exe tui --toolchain dist\toolchain --lace target\release\lace.exe --installer target\release\lace-installer.exe --out dist\tui --assets dist\apps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\apps

      # Dois assistentes do mesmo script: o completo, com o bundle dentro, e o
      # web (/DWeb), que baixa da release só os aplicativos escolhidos.
      - name: Montar os instaladores (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          target\release\lace-pack.exe inno --toolchain dist\toolchain --lace target\release\lace.exe --out dist\inno --web dist\tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:ISCC /Q "/DStage=$PWD\dist\inno" "/DLaceVersion=$env:VERSION" "/DBundle=$env:BUNDLE" "/O$PWD\dist" installer\windows\lace.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:ISCC /Q /DWeb "/DStage=$PWD\dist\inno" "/DLaceVersion=$env:VERSION" "/DBundle=$env:BUNDLE" "/O$PWD\dist" installer\windows\lace.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      # ---------------------------------------------------------- publicar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}-setup.exe
            dist/${{ env.NAME }}-web-setup.exe
            dist/apps/*
          if-no-files-found: error
          retention-days: 14
