# A ponte do Lace (crates/aurora-installer/src/lace.rs) de ponta a ponta, no
# Linux e no macOS: instala o Lace 0.9.0 da release v0.9.0, monta um
# instalador da AURORA mínimo com o `install` deste commit e roda o
# `lace update` de verdade contra um espelho local que imita uma release da
# AURORA: o instalador com o nome antigo e o SHA256SUMS, sem o índice com o
# nome antigo, como o release.yml publica. Confere que a AURORA ficou na
# pasta dela, com os aplicativos do Lace e o atalho aurora, e que o Lace
# saiu. O assistente do Windows se confere à mão (docs/RELEASE.md, seção 6.2).
#
# Roda a cada push numa release/*, antes da tag, e à mão.

name: lace-ponte

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  ponte:
    name: lace update (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Compilar a AURORA e o empacotador
        run: cargo build --release -p aurora-cli -p aurora-installer

      - name: Instalar o Lace 0.9.0, com o Icarus e o Lace Learn
        run: |
          curl -fsSL -o lace.tar.gz \
            "https://github.com/ART3121/lace/releases/download/v0.9.0/lace-0.9.0-${{ matrix.platform }}.tar.gz"
          tar xzf lace.tar.gz
          "./lace-0.9.0-${{ matrix.platform }}/install" --yes --components icarus,lace-learn
          ~/.local/share/lace/bin/lace --version
          cat ~/.local/share/lace/install.json

      # Um bundle com o Icarus e o AURORA Learn, de arquivos de mentira: o
      # que a troca precisa é o `install` e o `aurora` deste commit.
      - name: Um instalador da AURORA mínimo, no espelho
        run: |
          set -e
          tc="$PWD/mini/toolchain"
          mkdir -p "$tc/components" "$tc/oss/bin" "$tc/aurora-learn/verilog"
          printf '{"schema": 2, "bundle": "ponte", "platform": "%s"}' "${{ matrix.platform }}" > "$tc/bundle.json"
          printf '#!/bin/sh\necho iverilog\n' > "$tc/oss/bin/iverilog"
          chmod +x "$tc/oss/bin/iverilog"
          printf '{"name": "verilog"}' > "$tc/aurora-learn/verilog/track.json"
          manifest() {
            sum=$(shasum -a 256 "$tc/$3" | cut -d' ' -f1)
            printf '{"name": "%s", "version": "1", "dir": "%s", "source": "ponte", "files": {"%s": "%s"}}' \
              "$1" "$2" "$3" "$sum" > "$tc/components/$1.json"
          }
          manifest icarus oss oss/bin/iverilog
          manifest aurora-learn aurora-learn aurora-learn/verilog/track.json
          cat > mini/toolchain.contents.json <<EOF
          {"schema": 1, "bundle": "ponte", "platform": "${{ matrix.platform }}", "common": ["bundle.json"],
           "components": [
            {"name": "icarus", "label": "Icarus", "description": "o icarus", "recommended": true, "requires": [], "version": "1",
             "files": ["oss/bin/iverilog", "components/icarus.json"]},
            {"name": "aurora-learn", "label": "AURORA Learn", "description": "os exercícios", "recommended": false,
             "requires": ["icarus"], "version": "1",
             "files": ["aurora-learn/verilog/track.json", "components/aurora-learn.json"]}
           ]}
          EOF
          target/release/aurora-pack tui --toolchain "$tc" \
            --aurora target/release/aurora --installer target/release/aurora-installer \
            --out "mini/aurora-ponte-${{ matrix.platform }}" --tar-gz
          mkdir -p mirror/v1.0.0
          echo 1.0.0 > mirror/latest
          cp "mini/aurora-ponte-${{ matrix.platform }}.tar.gz" "mirror/v1.0.0/lace-1.0.0-${{ matrix.platform }}.tar.gz"
          (cd mirror/v1.0.0 && shasum -a 256 lace-1.0.0-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: lace update
        run: LACE_RELEASE_URL="file://$PWD/mirror" ~/.local/share/lace/bin/lace update --yes

      - name: Conferir a troca
        run: |
          set -e
          ~/.local/share/aurora/bin/aurora --version
          test "$(readlink ~/.local/bin/aurora)" = "$HOME/.local/share/aurora/bin/aurora"
          python3 - <<'EOF'
          import json, os
          receipt = json.load(open(os.path.expanduser("~/.local/share/aurora/install.json")))
          print("AURORA:", receipt["components"])
          assert sorted(receipt["components"]) == ["aurora-learn", "icarus"], receipt
          EOF
          if [ -e ~/.local/share/lace/bin/lace ] || [ -e ~/.local/share/lace/install.json ]; then
            echo "o Lace ficou"; ls -la ~/.local/share/lace; exit 1
          fi
          if [ -L ~/.local/bin/lace ] || [ -e ~/.local/bin/lace ]; then
            echo "o atalho lace ficou"; exit 1
          fi
          echo "o Lace saiu, e a AURORA ficou"
